name: Check

on:
  pull_request:
  push:
    branches:
      - "**" # matches every branch

jobs:
  lint_and_check:
    name: Lint and Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --store-dir /tmp/pnpm-store

      - name: Check formatting
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Run check
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Check standalone server starts
        run: |
          if timeout --signal=TERM --kill-after=3s 2s node .next/standalone/server.js; then
            echo "Standalone server exited unexpectedly"
            exit 1
          else
            test "$?" -eq 124
          fi
